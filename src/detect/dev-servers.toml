# Dev-server identification from terminal banner text.
#
# This is the fallback namer. A server whose listening socket is attributable
# to a pane's process tree is named from the owning process argv instead, which
# needs no rules at all. These patterns exist for servers no socket scan can
# reach: inside a container, on the far side of an SSH session.
#
# Highest `priority` wins, so a wrapper that prints its own banner over another
# tool's can outrank what it wraps. Equal priorities resolve by `id` order,
# which is stable but arbitrary — set a priority rather than relying on it.
#
# A rule matches when every one of its top-level matchers matches:
#   contains    every string must appear
#   regex       every pattern must match somewhere
#   all/any/not nested gates, for cases the flat fields cannot express
#
# Overriding: drop a file at ~/.config/herdr/dev-servers.toml to replace this
# one entirely, then run `herdr server reload-agent-manifests`.

version = 1

# --- JavaScript build tools and frameworks ---------------------------------

# SvelteKit and Remix both run on Vite and print their own banner over it.
[[servers]]
id = "sveltekit"
priority = 200
contains = ["SvelteKit v"]

[[servers]]
id = "vite"
priority = 100
contains = ["VITE v"]

[[servers]]
id = "nextjs"
priority = 150
any = [{ contains = ["▲ Next.js"] }, { contains = ["◼ Next.js"] }]

[[servers]]
id = "nestjs"
priority = 150
any = [
  # "[Nest] 12345  - ..." — the bare word appears in unrelated output.
  { regex = ['\[Nest\]\s+\d'] },
  { contains = ["Nest application successfully started"] },
]

[[servers]]
id = "webpack"
priority = 150
contains = ["[webpack-dev-server]"]

[[servers]]
id = "nuxt"
priority = 150
contains = ["ready"]
any = [{ contains = ["▲ Nuxt"] }, { contains = ["Nuxt "] }]

[[servers]]
id = "remix"
priority = 150
any = [
  { contains = ["Remix App Server"] },
  { all = [{ contains = ["remix"] }, { contains = ["built"] }] },
]

[[servers]]
id = "astro"
priority = 150
any = [
  { contains = [" astro  v"] },
  { all = [{ contains = ["astro"] }, { contains = ["ready in"] }] },
]

[[servers]]
id = "gatsby"
priority = 150
any = [
  { contains = ["Gatsby develop"] },
  { all = [{ contains = ["gatsby"] }, { contains = ["You can now view"] }] },
]

[[servers]]
id = "storybook"
priority = 150
contains = ["Storybook"]
any = [{ contains = ["started"] }, { contains = ["ready"] }]

[[servers]]
id = "angular"
priority = 150
contains = ["Angular Live Development Server"]

[[servers]]
id = "expo"
priority = 150
contains = ["Metro", "Expo"]

[[servers]]
id = "bun"
priority = 60
any = [{ contains = ["bun run"] }, { contains = ["$ bun "] }]

[[servers]]
id = "deno"
priority = 60
contains = ["Listening on http", "deno"]

